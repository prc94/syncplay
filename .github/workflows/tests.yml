name: Tests

# Fork test suites (yap timer, pause warning, OSD channel, server admins, track
# proposals). Upstream has no tests; these are self-contained scripts driven by
# tests/run_all.py — they print [PASS]/[FAIL] lines and exit non-zero on failure.
on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # requirements_gui.txt gates PySide6 on >= 3.12

      # suite_admin builds the real Qt ConfigDialog on the offscreen platform.
      - name: Install offscreen Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements_gui.txt

      - name: Run unit suites
        env:
          PYTHONPATH: ${{ github.workspace }}
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          python3 tests/run_all.py --unit-only 2>&1 | tee suites.log && exit 0
          grep -E '\[FAIL\]|^  FAIL|Traceback' suites.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1

  e2e:
    name: E2E suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # E2E boots real headless syncplayServer.py subprocesses — no Qt needed.
      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run E2E suites
        env:
          PYTHONPATH: ${{ github.workspace }}
        # Failing checks are echoed as ::error:: so they show up as annotations on the run,
        # readable without pulling the whole log.
        run: |
          set -o pipefail
          python3 tests/run_all.py --e2e-only 2>&1 | tee suites.log && exit 0
          grep -E '\[FAIL\]|^  FAIL|Traceback' suites.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          echo "::notice::env $(python3 -V) | $(pip freeze | grep -iE '^(twisted|cryptography|pyopenssl|service-identity|attrs|certifi|pem)==' | tr '\n' ' ')"
          exit 1
